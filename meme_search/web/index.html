<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme search</title>
<style>
  :root { --bg: #111; --card: #1c1c1c; --fg: #eee; --dim: #999; --acc: #ffd23f; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--dim); margin: 0 0 20px; }
  form { display: flex; gap: 8px; }
  #q { flex: 1; padding: 12px 14px; font-size: 17px; border-radius: 8px; border: 1px solid #333; background: #000; color: var(--fg); }
  button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--acc); color: #000; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { color: var(--dim); margin: 10px 0 18px; min-height: 1.4em; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .card { background: var(--card); border-radius: 10px; padding: 12px; }
  canvas { width: 100%; height: auto; border-radius: 6px; display: block; background: #000; }
  .meta { color: var(--dim); font-size: 13px; margin: 8px 0; }
  .chips span { display: inline-block; padding: 1px 7px; margin: 0 4px 4px 0; border-radius: 10px; background: #333; font-size: 12px; }
  .slot { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .slot label { color: var(--dim); font-size: 12px; width: 44px; }
  .slot input { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #333; background: #000; color: var(--fg); }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row button { padding: 6px 12px; font-size: 13px; }
  .row .ghost { background: #333; color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Meme search</h1>
  <p class="sub">Describe a situation. CLIP finds a meme template; edit the text and download.</p>
  <form id="f">
    <input id="q" placeholder="my code finally compiled after 6 hours of debugging" autocomplete="off" autofocus>
    <button id="go" disabled>Search</button>
  </form>
  <div id="status">Loading model…</div>
  <div id="results"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
