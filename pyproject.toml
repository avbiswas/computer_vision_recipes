[project]
name = "computer-vision-recipes"
version = "0.1.0"
description = "CV speedrun projects (world model environment used on cloud GPUs)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.9",
    "numpy",
    "pillow",
    "matplotlib",
    "pygame-ce",
]

[tool.uv]
package = false

# Linux (cloud GPU): CUDA 12.8 wheels (work with NVIDIA driver >= 570). macOS: regular PyPI wheels (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
